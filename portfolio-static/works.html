<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>All Work — Rin</title><link rel="stylesheet" href="style.css"><header><a class="brand" href="./">Rin</a><a href="./">Home ↗</a></header><main class="directory"><h1>All Work.</h1><p>Selected design previews.</p><div class="work-grid"></div></main><dialog aria-label="Project preview"><button id="close">Close ×</button><img alt=""><p></p></dialog><script type="module">const data=await fetch("content.json").then(r=>r.json());document.querySelector(".work-grid").innerHTML=data.projects.map(p=>`<article id="${p.key}"><button data-image="${p.image}" data-title="${p.name}"><img width="${data.imageSizes[p.image][0]}" height="${data.imageSizes[p.image][1]}" src="media/${p.image}" alt="${p.name} original portfolio cover"><h2>${p.name}</h2><p>${p.category} · View preview ↗</p></button></article>`).join("");const d=document.querySelector('dialog');document.querySelectorAll('[data-image]').forEach(b=>b.onclick=()=>{d.querySelector('img').src='media/'+b.dataset.image;d.querySelector('img').alt=b.dataset.title;d.querySelector('p').textContent=b.dataset.title+' / Original portfolio preview';d.showModal()});document.querySelector('#close').onclick=()=>d.close();d.onclick=e=>{if(e.target===d)d.close()};const key=new URLSearchParams(location.search).get('project');if(key)document.getElementById(key)?.scrollIntoView({block:'center'});</script><script type="module" src="interactions.js"></script></html>
